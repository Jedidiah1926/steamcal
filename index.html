<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam 세금 심사 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- 색상 ---------- */
  :root {
    --paper: #f4f2ed;
    --surface: #fbfaf7;
    --ink: #1c1b19;
    --ink-2: #5d5a52;
    --ink-3: #a29e94;
    --rule: #dcd8ce;
    --off: #ebe8e1;
    --holiday: #b3362c;
    --hover: rgba(28, 27, 25, .045);

    --c-start: #74c0ea;   /* 하늘색: 선택한 날 */
    --c-g: #3aa56a;       /* 초록: 1~15 영업일 */
    --c-y: #e8bf2c;       /* 노랑: 16~30 영업일 */
    --c-o: #ea812d;       /* 주황: 31~45 영업일 */
    --bar-text: #15201a;

    --sans: "IBM Plex Sans KR", "IBM Plex Sans JP", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121210;
      --surface: #191917;
      --ink: #ecebe6;
      --ink-2: #a3a097;
      --ink-3: #6b6961;
      --rule: #33322e;
      --off: #1f1e1b;
      --holiday: #ee7d70;
      --hover: rgba(236, 235, 230, .05);
      --c-start: #63b2de;
      --c-g: #349a61;
      --c-y: #d9b022;
      --c-o: #dc7426;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121210;
    --surface: #191917;
    --ink: #ecebe6;
    --ink-2: #a3a097;
    --ink-3: #6b6961;
    --rule: #33322e;
    --off: #1f1e1b;
    --holiday: #ee7d70;
    --hover: rgba(236, 235, 230, .05);
    --c-start: #63b2de;
    --c-g: #349a61;
    --c-y: #d9b022;
    --c-o: #dc7426;
    color-scheme: dark;
  }
  :lang(ja) { --sans: "IBM Plex Sans JP", "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }

  /* ---------- 기본 ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { scrollbar-width: thin; scrollbar-color: var(--ink-3) transparent; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: var(--ink); color: var(--paper); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ink-3); border: 3px solid var(--paper); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-2); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 56px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---------- 버튼 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; min-width: 34px; padding: 0 12px;
    font: 500 14px/1 var(--sans); color: var(--ink);
    background: var(--surface); border: 1px solid var(--ink); border-radius: 3px;
    cursor: pointer; transition: background-color .12s, color .12s;
  }
  .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: square; }
  .btn.icon { padding: 0; width: 34px; }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn.quiet { border-color: var(--rule); color: var(--ink-2); height: 28px; font-size: 13px; padding: 0 10px; }
  .btn.quiet:hover { border-color: var(--ink); background: var(--surface); color: var(--ink); }

  .seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .seg button {
    height: 32px; padding: 0 11px; font: 600 12px/1 var(--mono); letter-spacing: .06em;
    color: var(--ink); background: var(--surface); border: 0; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--ink); }
  .seg button:hover { background: var(--hover); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* ---------- 머리말 ---------- */
  header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px;
    padding-bottom: 14px; border-bottom: 2px solid var(--ink);
  }
  h1 { font-size: 26px; line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 6px; max-width: 640px; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 12px 0;
    font-size: 12.5px; color: var(--ink-2); border-bottom: 1px solid var(--rule);
  }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { width: 18px; height: 10px; display: inline-block; flex: none; }
  .sw.hatch {
    background-image: linear-gradient(-45deg, var(--c-g) 0 20%, transparent 20% 50%, var(--c-g) 50% 70%, transparent 70% 100%);
    background-size: 6px 6px; box-shadow: inset 0 0 0 1px var(--c-g);
  }
  .sw.off { background: var(--off); box-shadow: inset 0 0 0 1px var(--rule); }

  /* ---------- 섹션 공통 ---------- */
  .block { padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .label {
    font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-2); margin: 0 0 10px;
  }

  /* ---------- 추가 비영업일 (체크 칩) ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 12px 0 10px;
    font-size: 13.5px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 3px;
    cursor: pointer; user-select: none; transition: border-color .12s;
  }
  .chip:hover { border-color: var(--ink-2); }
  .chip:has(input:checked) { border-color: var(--ink); }
  .chip:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
  .chip input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
  .chip .box {
    width: 16px; height: 16px; flex: none; display: grid; place-items: center;
    border: 1.5px solid var(--ink-3); border-radius: 2px; background: var(--surface);
    transition: background-color .12s, border-color .12s;
  }
  .chip .box::after {
    content: ""; width: 8px; height: 4px; margin-top: -2px;
    border-left: 2px solid var(--paper); border-bottom: 2px solid var(--paper);
    transform: rotate(-45deg); opacity: 0;
  }
  .chip input:checked + .box { background: var(--ink); border-color: var(--ink); }
  .chip input:checked + .box::after { opacity: 1; }
  .chip .dt { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .chip input:checked ~ .dt { color: var(--ink-2); }
  .hint { color: var(--ink-2); font-size: 12.5px; margin: 10px 0 0; }

  /* ---------- 요약 ---------- */
  .sum-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .sum-top .picked { font-size: 15px; }
  .sum-top .picked b { font-weight: 700; margin-left: 8px; font-variant-numeric: tabular-nums; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
  .steps li {
    padding: 10px 12px 8px; border-left: 1px solid var(--rule); cursor: pointer;
    border-top: 3px solid var(--c); margin-top: -1px;
  }
  .steps li:first-child { border-left: 0; padding-left: 0; }
  .steps li:hover { background: var(--hover); }
  .steps .k { display: block; font-size: 12px; color: var(--ink-2); }
  .steps .v { display: block; font-size: 14.5px; font-weight: 600; margin-top: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty-hint { color: var(--ink-2); margin: 0; }

  /* ---------- 달력 ---------- */
  .cal { margin-top: 20px; border: 1px solid var(--ink); background: var(--surface); touch-action: pan-y; }
  .mhead { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--ink); }
  .mhead h2 { margin: 0; flex: 1; display: flex; align-items: baseline; gap: 10px; font-weight: 700; }
  .mhead .m { font-size: 24px; letter-spacing: -0.02em; }
  .mhead .y { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--ink-2); }
  .nav { display: flex; gap: 6px; }

  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .dow {
    font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-2); padding: 7px 8px; border-bottom: 1px solid var(--rule);
  }
  .dow.we { color: var(--holiday); }

  .cell {
    position: relative; min-height: 92px; width: 100%;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start;
    padding: 6px 7px 30px; text-align: left;
    font: inherit; color: inherit; background: transparent; border: 0;
    border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    cursor: pointer;
  }
  .cell:nth-child(7n) { border-right: 0; }
  .grid > .cell:nth-last-child(-n+7) { border-bottom: 0; }
  .cell.off { background: var(--off); }
  @media (hover: hover) { .cell:hover { background-image: linear-gradient(var(--hover), var(--hover)); } }
  .cell:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; z-index: 2; }
  .num { font-family: var(--mono); font-size: 13px; font-weight: 600; line-height: 20px; }
  .cell.off .num { color: var(--ink-2); font-weight: 500; }
  .cell.hol .num { color: var(--holiday); font-weight: 600; }
  .cell.today .num { background: var(--ink); color: var(--paper); padding: 0 5px; }
  .hname {
    font-size: 10.5px; line-height: 1.25; color: var(--holiday); margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: keep-all;
  }
  .cell.weekend-hol .hname { opacity: .75; }
  .hname.inactive { color: var(--ink-3); }

  /* 이전/다음 달 날짜: 옅게 */
  .cell.adj > * { opacity: .35; }
  .cell.adj.off { background: color-mix(in srgb, var(--off) 45%, var(--surface)); }

  /* 진행 바 */
  .bar {
    position: absolute; left: 0; right: -1px; bottom: 7px; height: 17px; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--bar-text);
    pointer-events: none;
  }
  .bar.s0 { --c: var(--c-start); }
  .bar.s1 { --c: var(--c-g); }
  .bar.s2 { --c: var(--c-y); }
  .bar.s3 { --c: var(--c-o); }
  .bar.fill { background: var(--c); }
  /* 빗금: 이어지는 칸끼리 무늬가 맞도록 10px 정사각 타일 + JS에서 위치 정렬 */
  .bar.hatch {
    background-image: linear-gradient(-45deg, var(--c) 0 20%, transparent 20% 50%, var(--c) 50% 70%, transparent 70% 100%);
    background-size: 10px 10px;
    background-color: var(--off); /* 칸 사이 테두리선이 빗금 사이로 비치지 않게 */
    box-shadow: inset 0 1.5px 0 var(--c), inset 0 -1.5px 0 var(--c);
  }
  .cell.adj .bar.hatch { background-color: color-mix(in srgb, var(--off) 45%, var(--surface)); }
  .bar.first { left: 6px; border-radius: 2px 0 0 2px; }
  .bar.last { right: 6px; border-radius: 0 2px 2px 0; }
  .bar.milestone { box-shadow: inset -2px 0 0 rgba(0, 0, 0, .35); }
  .cell.sel { box-shadow: inset 0 0 0 2px var(--c-start); }

  /* ---------- 공휴일 목록 ---------- */
  .holist { margin-top: 20px; border-top: 1px solid var(--ink); }
  .holist summary {
    list-style: none; cursor: pointer; padding: 12px 0; font-weight: 600; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .holist summary::-webkit-details-marker { display: none; }
  .holist summary::before {
    content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    transform: rotate(-45deg); transition: transform .15s; margin-right: 2px;
  }
  .holist[open] summary::before { transform: rotate(45deg); }
  .holist .scroll {
    max-height: 280px; overflow-y: auto; border: 1px solid var(--rule); background: var(--surface);
    scrollbar-width: thin; scrollbar-color: var(--ink-3) transparent;
  }
  .holist .scroll::-webkit-scrollbar-thumb { border-color: var(--surface); }
  .holist ul { list-style: none; padding: 0; margin: 0; font-size: 13.5px; }
  .holist li { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--rule); }
  .holist li:last-child { border-bottom: 0; }
  .holist li .d { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .holist li .obs { color: var(--ink-3); font-size: 12px; margin-left: 6px; }
  .holist li.opt .n { color: var(--ink-2); }
  .note { color: var(--ink-2); font-size: 12px; margin-top: 14px; max-width: 760px; }

  /* ---------- 휴대폰 ---------- */
  @media (max-width: 720px) {
    .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .steps li:nth-child(odd) { border-left: 0; padding-left: 0; }
  }
  @media (max-width: 480px) {
    .wrap { padding-top: 20px; }
    /* 칩은 한 줄 가로 스크롤 */
    .chips {
      flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 10px;
      scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: var(--ink-3) transparent;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 24px), transparent);
              mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 24px), transparent);
    }
    .chips::-webkit-scrollbar { height: 6px; }
    .chips::-webkit-scrollbar-thumb { border: 0; background: var(--rule); }
    .chip { flex: none; scroll-snap-align: start; }
    h1 { font-size: 21px; }
    .mhead { padding: 10px; gap: 8px; }
    .mhead .m { font-size: 20px; }
    .mhead .y { font-size: 13px; }
    .nav { gap: 4px; }
    .dow { padding: 6px 4px; font-size: 10.5px; letter-spacing: 0; text-align: center; }
    .cell { min-height: 64px; padding: 4px 3px 25px; }
    .num { font-size: 12px; }
    .hname { font-size: 9.5px; -webkit-line-clamp: 1; }
    .bar { height: 15px; font-size: 10px; bottom: 5px; }
    .bar.first { left: 3px; }
    .bar.last { right: 3px; }
    .holist li { grid-template-columns: 1fr; gap: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="title"></h1>
      <div class="sub" data-i18n="sub"></div>
    </div>
    <div class="seg" id="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko">KR</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ja">JP</button>
    </div>
  </header>

  <div class="legend">
    <span><i class="sw" style="background:var(--c-start)"></i><span data-i18n="lgSel"></span></span>
    <span><i class="sw" style="background:var(--c-g)"></i><span data-i18n="lgG"></span></span>
    <span><i class="sw" style="background:var(--c-y)"></i><span data-i18n="lgY"></span></span>
    <span><i class="sw" style="background:var(--c-o)"></i><span data-i18n="lgO"></span></span>
    <span><i class="sw hatch"></i><span data-i18n="lgHatch"></span></span>
    <span><i class="sw off"></i><span data-i18n="lgOff"></span></span>
  </div>

  <section class="block" id="opts">
    <h3 class="label" data-i18n="optTitle"></h3>
    <div class="chips" id="chips"></div>
    <p class="hint" data-i18n="optHint"></p>
  </section>

  <section class="block" id="summary"></section>

  <section class="cal" id="months">
    <div class="mhead">
      <h2 id="mtitle"></h2>
      <div class="nav">
        <button class="btn" id="today" data-i18n="today"></button>
        <button class="btn icon" id="prev"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
        <button class="btn icon" id="next"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
      </div>
    </div>
    <div class="grid"></div>
  </section>

  <details class="holist" id="holist">
    <summary></summary>
    <div class="scroll"><ul id="holist-ul"></ul></div>
  </details>
  <p class="note" data-i18n="note"></p>
</div>

<script>
(() => {
  // ---------- 다국어 (KR / EN / JP) ----------
  const I18N = {
    ko: {
      htmlLang: 'ko',
      title: 'Steam 세금 심사 캘린더',
      sub: '날짜를 누르면 다음 영업일부터 45영업일까지 표시합니다. 주말과 미국 연방 공휴일은 영업일에서 빠집니다.',
      today: '오늘', prev: '이전 달', next: '다음 달',
      lgSel: '선택한 날', lgG: '1–15 영업일', lgY: '16–30 영업일', lgO: '31–45 영업일',
      lgHatch: '비영업일 (빗금)', lgOff: '주말·미국 공휴일',
      optTitle: '추가 비영업일',
      optHint: '연방 공휴일은 아니지만 쉬는 회사가 많은 날입니다. 기본으로 켜져 있으며, 끄면 영업일로 계산합니다.',
      note: '공휴일이 토요일이면 전날(금), 일요일이면 다음날(월)이 대체 휴무일(비영업일)로 처리됩니다. 막대 안 숫자는 영업일 수입니다. 추가 비영업일은 주말과 겹치면 대체 휴무 없이 그대로 둡니다.',
      hint: '달력에서 날짜를 누르세요. 같은 날짜를 다시 누르면 선택이 해제됩니다.',
      selected: '선택한 날', clear: '선택 해제', start: '선택',
      bd: n => `${n}영업일`, biz: '영업일', nonbiz: '비영업일',
      optOn: '추가 비영업일', optOff: '옵션 꺼짐: 영업일',
      holList: ys => `미국 연방 공휴일 목록 (${ys})`,
      observedTo: d => `→ 대체 휴무 ${d}`, observed: ' (대체)',
      listOptOn: '추가 옵션 · 켜짐', listOptOff: '추가 옵션 · 꺼짐',
      dow: ['일', '월', '화', '수', '목', '금', '토'],
      monthParts: (y, m) => [`${m + 1}월`, `${y}`],
      fmt: (d, w) => `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()} (${w})`,
      short: (d, w) => `${d.getMonth() + 1}/${d.getDate()} ${w}`,
    },
    en: {
      htmlLang: 'en',
      title: 'Steam Tax Review Calendar',
      sub: 'Tap a date to mark business days 1–45, starting the next business day. Weekends and US federal holidays are not counted.',
      today: 'Today', prev: 'Previous month', next: 'Next month',
      lgSel: 'Selected day', lgG: 'Business days 1–15', lgY: 'Business days 16–30', lgO: 'Business days 31–45',
      lgHatch: 'Non-business day (hatched)', lgOff: 'Weekend / US holiday',
      optTitle: 'Extra non-business days',
      optHint: 'Not federal holidays, but many companies are closed. They are on by default; turn one off to count it as a business day.',
      note: 'A holiday on Saturday is observed the Friday before; on Sunday, the Monday after. Numbers in the bar are business-day counts. Extra non-business days that fall on a weekend are not moved.',
      hint: 'Tap a date on the calendar. Tap the same date again to clear.',
      selected: 'Selected day', clear: 'Clear', start: 'Start',
      bd: n => `Business day ${n}`, biz: 'Business day', nonbiz: 'Non-business day',
      optOn: 'extra non-business day', optOff: 'option off: business day',
      holList: ys => `US federal holidays (${ys})`,
      observedTo: d => `→ observed ${d}`, observed: ' (observed)',
      listOptOn: 'extra option · on', listOptOff: 'extra option · off',
      dow: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      monthParts: (y, m) => [new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long' }), `${y}`],
      fmt: (d, w) => `${w}, ${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`,
      short: (d, w) => `${w} ${d.getMonth() + 1}/${d.getDate()}`,
    },
    ja: {
      htmlLang: 'ja',
      title: 'Steam 税務審査カレンダー',
      sub: '日付を押すと、翌営業日から45営業日目までを表示します。土日と米国連邦祝日は営業日に含めません。',
      today: '今日', prev: '前の月', next: '次の月',
      lgSel: '選択日', lgG: '1–15営業日', lgY: '16–30営業日', lgO: '31–45営業日',
      lgHatch: '非営業日（斜線）', lgOff: '土日・米国祝日',
      optTitle: '追加の非営業日',
      optHint: '連邦祝日ではありませんが、休業する企業が多い日です。初期設定でオンになっており、オフにすると営業日として計算します。',
      note: '祝日が土曜日の場合は前日（金）、日曜日の場合は翌日（月）が振替休日（非営業日）になります。バー内の数字は営業日数です。追加の非営業日が土日と重なる場合は振り替えません。',
      hint: 'カレンダーの日付を押してください。同じ日付をもう一度押すと解除されます。',
      selected: '選択日', clear: '選択解除', start: '選択',
      bd: n => `${n}営業日`, biz: '営業日', nonbiz: '非営業日',
      optOn: '追加の非営業日', optOff: 'オプション無効：営業日',
      holList: ys => `米国連邦祝日一覧（${ys}）`,
      observedTo: d => `→ 振替休日 ${d}`, observed: '（振替）',
      listOptOn: '追加オプション・有効', listOptOff: '追加オプション・無効',
      dow: ['日', '月', '火', '水', '木', '金', '土'],
      monthParts: (y, m) => [`${m + 1}月`, `${y}年`],
      fmt: (d, w) => `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${w}）`,
      short: (d, w) => `${d.getMonth() + 1}/${d.getDate()}（${w}）`,
    },
  };

  const HOL_NAMES = {
    newYear:      { ko: '새해 첫날', en: "New Year's Day", ja: '元日' },
    mlk:          { ko: '마틴 루터 킹 데이', en: 'MLK Jr. Day', ja: 'キング牧師記念日' },
    presidents:   { ko: '대통령의 날', en: "Presidents' Day", ja: '大統領の日' },
    memorial:     { ko: '메모리얼 데이', en: 'Memorial Day', ja: 'メモリアルデー' },
    juneteenth:   { ko: '준틴스', en: 'Juneteenth', ja: 'ジューンティーンス' },
    independence: { ko: '독립기념일', en: 'Independence Day', ja: '独立記念日' },
    labor:        { ko: '노동절', en: 'Labor Day', ja: 'レイバー・デー' },
    columbus:     { ko: '콜럼버스 데이', en: 'Columbus Day', ja: 'コロンブス・デー' },
    veterans:     { ko: '재향군인의 날', en: 'Veterans Day', ja: '復員軍人の日' },
    thanksgiving: { ko: '추수감사절', en: 'Thanksgiving', ja: '感謝祭' },
    christmas:    { ko: '크리스마스', en: 'Christmas Day', ja: 'クリスマス' },
    // 추가 비영업일 (옵션)
    thanksFri:    { ko: '추수감사절 다음날', en: 'Day after Thanksgiving', ja: '感謝祭の翌日' },
    xmasEve:      { ko: '크리스마스이브', en: 'Christmas Eve', ja: 'クリスマス・イブ' },
    nye:          { ko: '새해 전날', en: "New Year's Eve", ja: '大晦日' },
  };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };

  function initialLang() {
    try {
      const q = new URLSearchParams(location.search).get('lang');
      if (q && I18N[q]) return q;
    } catch {}
    const saved = store.get('steamcal.lang');
    if (saved && I18N[saved]) return saved;
    const nav = (navigator.language || '').toLowerCase();
    if (nav.startsWith('ja')) return 'ja';
    if (nav.startsWith('en')) return 'en';
    return 'ko';
  }
  let lang = initialLang();
  const T = () => I18N[lang];
  const hname = id => HOL_NAMES[id][lang];

  // ---------- 날짜 유틸 ----------
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const fmt = d => T().fmt(d, T().dow[d.getDay()]);
  const fmtShort = d => T().short(d, T().dow[d.getDay()]);

  // ---------- 미국 연방 공휴일 ----------
  const nthWeekday = (y, m, wd, n) => {
    const first = new Date(y, m, 1);
    return new Date(y, m, 1 + ((wd - first.getDay() + 7) % 7) + (n - 1) * 7);
  };
  const lastWeekday = (y, m, wd) => {
    const last = new Date(y, m + 1, 0);
    return new Date(y, m, last.getDate() - ((last.getDay() - wd + 7) % 7));
  };
  const observedOf = d => d.getDay() === 6 ? addDays(d, -1) : d.getDay() === 0 ? addDays(d, 1) : d;

  function holidaysOfYear(y) {
    const list = [
      { id: 'newYear', d: new Date(y, 0, 1), fixed: true },
      { id: 'mlk', d: nthWeekday(y, 0, 1, 3) },
      { id: 'presidents', d: nthWeekday(y, 1, 1, 3) },
      { id: 'memorial', d: lastWeekday(y, 4, 1) },
      ...(y >= 2021 ? [{ id: 'juneteenth', d: new Date(y, 5, 19), fixed: true }] : []),
      { id: 'independence', d: new Date(y, 6, 4), fixed: true },
      { id: 'labor', d: nthWeekday(y, 8, 1, 1) },
      { id: 'columbus', d: nthWeekday(y, 9, 1, 2) },
      { id: 'veterans', d: new Date(y, 10, 11), fixed: true },
      { id: 'thanksgiving', d: nthWeekday(y, 10, 4, 4) },
      { id: 'christmas', d: new Date(y, 11, 25), fixed: true },
    ];
    return list.map(h => ({ ...h, obs: h.fixed ? observedOf(h.d) : h.d }));
  }

  // 선택형 비영업일 (연방 공휴일 아님). 날짜 순서대로 표시
  const OPTIONAL = {
    thanksFri: y => addDays(nthWeekday(y, 10, 4, 4), 1),
    xmasEve: y => new Date(y, 11, 24),
    nye: y => new Date(y, 11, 31),
  };
  // 저장된 값이 없으면 기본으로 켜짐
  let opts = {};
  const isOn = id => (id in opts ? !!opts[id] : true);
  function optionalOf(d) {
    const k = keyOf(d);
    for (const [id, dateOf] of Object.entries(OPTIONAL)) {
      if (keyOf(dateOf(d.getFullYear())) === k) return { id, on: isOn(id) };
    }
    return null;
  }

  // key -> { id, observed }, holOff: 비영업 공휴일 키
  const holInfo = new Map();
  const holOff = new Set();
  const loadedYears = new Set();
  function ensureYear(y) {
    if (loadedYears.has(y)) return;
    loadedYears.add(y);
    for (const h of holidaysOfYear(y)) {
      const ak = keyOf(h.d), ok = keyOf(h.obs);
      holInfo.set(ak, { id: h.id, observed: false });
      holOff.add(ok);
      if (ok !== ak) holInfo.set(ok, { id: h.id, observed: true });
    }
  }
  const prepare = d => { ensureYear(d.getFullYear() - 1); ensureYear(d.getFullYear()); ensureYear(d.getFullYear() + 1); };
  const holidayOf = d => { prepare(d); return holInfo.get(keyOf(d)); };
  const isBusiness = d => {
    prepare(d);
    const w = d.getDay();
    if (w === 0 || w === 6 || holOff.has(keyOf(d))) return false;
    const o = optionalOf(d);
    return !(o && o.on);
  };

  // ---------- 영업일 계산 ----------
  const segOf = n => n <= 15 ? 1 : n <= 30 ? 2 : 3;
  function computeRange(start) {
    // key -> { seg: 0..3, bd: 영업일 번호 | null, first, last }
    const map = new Map();
    map.set(keyOf(start), { seg: 0, bd: null, first: true });
    const milestones = {};
    let count = 0, d = start, pending = [];
    while (count < 45) {
      d = addDays(d, 1);
      if (isBusiness(d)) {
        count++;
        const seg = segOf(count);
        // 영업일 사이에 낀 비영업일만 다음 영업일의 구간 색으로 빗금 처리 (45영업일 이후는 칠하지 않음)
        for (const p of pending) map.set(keyOf(p), { seg, bd: null });
        pending = [];
        map.set(keyOf(d), { seg, bd: count, last: count === 45, milestone: count === 15 || count === 30 });
        if ([1, 15, 16, 30, 31, 45].includes(count)) milestones[count] = d;
      } else {
        pending.push(d);
      }
    }
    return { map, milestones };
  }

  // ---------- 상태 ----------
  const now = new Date();
  const todayKey = keyOf(now);
  let selected = store.get('steamcal.selected');
  if (selected && !/^\d{4}-\d{2}-\d{2}$/.test(selected)) selected = null;
  try { const o = JSON.parse(store.get('steamcal.opts') || '{}'); if (o && typeof o === 'object') opts = o; } catch {}
  let view = selected ? fromKey(selected) : now;
  view = new Date(view.getFullYear(), view.getMonth(), 1);

  // ---------- 렌더 ----------
  const $months = document.getElementById('months');
  const $summary = document.getElementById('summary');
  const $chips = document.getElementById('chips');

  function applyStatic() {
    const t = T();
    document.documentElement.lang = t.htmlLang;
    document.title = t.title;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
    document.getElementById('prev').setAttribute('aria-label', t.prev);
    document.getElementById('next').setAttribute('aria-label', t.next);
    document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  }

  function render() {
    const range = selected ? computeRange(fromKey(selected)) : null;
    const [mName, yName] = T().monthParts(view.getFullYear(), view.getMonth());
    document.getElementById('mtitle').innerHTML = `<span class="m">${mName}</span><span class="y">${yName}</span>`;
    $months.querySelector('.grid').replaceWith(renderGrid(view, range));
    renderChips();
    renderSummary(range);
    renderHolidayList();
    alignHatches();
  }

  // 각 빗금 막대의 무늬 시작점을 달력(그리드) 기준으로 맞춰서, 칸이 바뀌어도 빗금이 끊기지 않게 함
  function alignHatches() {
    document.querySelectorAll('.grid').forEach(grid => {
      const gx = grid.getBoundingClientRect().left;
      grid.querySelectorAll('.bar.hatch').forEach(bar => {
        const x = bar.getBoundingClientRect().left - gx;
        bar.style.backgroundPosition = `${-x}px 0`;
      });
    });
  }
  if ('ResizeObserver' in window) new ResizeObserver(() => alignHatches()).observe($months);
  else window.addEventListener('resize', alignHatches);

  // 추가 비영업일 체크 칩 (보고 있는 해의 날짜를 같이 표시)
  function renderChips() {
    const y = view.getFullYear();
    $chips.innerHTML = Object.entries(OPTIONAL).map(([id, dateOf]) => `
      <label class="chip">
        <input type="checkbox" data-opt="${id}"${isOn(id) ? ' checked' : ''}>
        <span class="box" aria-hidden="true"></span>
        <span>${hname(id)}</span>
        <span class="dt">${fmtShort(dateOf(y))}</span>
      </label>`).join('');
  }
  $chips.addEventListener('change', e => {
    const cb = e.target.closest('input[data-opt]');
    if (!cb) return;
    opts[cb.dataset.opt] = cb.checked;
    store.set('steamcal.opts', JSON.stringify(opts));
    render();
    const again = $chips.querySelector(`input[data-opt="${cb.dataset.opt}"]`);
    if (again) again.focus({ preventScroll: true });
  });

  // 한 달 그리드. 앞뒤 빈칸은 이전/다음 달 날짜로 채움
  function renderGrid(first, range) {
    const t = T();
    const y = first.getFullYear(), m = first.getMonth();
    const grid = document.createElement('div');
    grid.className = 'grid';
    t.dow.forEach((n, i) => {
      const el = document.createElement('div');
      el.className = 'dow' + (i === 0 || i === 6 ? ' we' : '');
      el.textContent = n;
      grid.appendChild(el);
    });
    const days = new Date(y, m + 1, 0).getDate();
    const lead = first.getDay();
    const total = Math.ceil((lead + days) / 7) * 7;
    const gridStart = new Date(y, m, 1 - lead);
    for (let i = 0; i < total; i++) {
      const d = addDays(gridStart, i);
      const adj = d.getMonth() !== m;
      const dayNum = adj && d.getDate() === 1 ? `${d.getMonth() + 1}/1` : d.getDate();
      const k = keyOf(d);
      const hol = holidayOf(d);
      const biz = isBusiness(d);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell' + (adj ? ' adj' : '');
      if (!biz) cell.classList.add('off');
      if (hol) cell.classList.add('hol');
      if (hol && !hol.observed && !holOff.has(k)) cell.classList.add('weekend-hol');
      if (k === todayKey) cell.classList.add('today');
      if (k === selected) cell.classList.add('sel');
      cell.dataset.key = k;

      let title = `${fmt(d)} · ${biz ? t.biz : t.nonbiz}`;
      let html = `<span class="num">${dayNum}</span>`;
      const opt = hol ? null : optionalOf(d);
      if (opt && opt.on) cell.classList.add('hol');
      if (hol) {
        const name = hname(hol.id) + (hol.observed ? t.observed : '');
        html += `<div class="hname">${name}</div>`;
        title += ` · ${name}` + (lang !== 'en' ? ` / ${HOL_NAMES[hol.id].en}` : '');
      } else if (opt) {
        const name = hname(opt.id);
        html += `<div class="hname${opt.on ? '' : ' inactive'}">${name}</div>`;
        title += ` · ${name} (${opt.on ? t.optOn : t.optOff})`;
      }

      const r = range && range.map.get(k);
      if (r) {
        const cls = ['bar', 's' + r.seg, (r.seg === 0 || r.bd) ? 'fill' : 'hatch'];
        if (r.first) cls.push('first');
        if (r.last) cls.push('last');
        if (r.milestone) cls.push('milestone');
        const label = r.seg === 0 ? t.start : (r.bd ?? '');
        html += `<div class="${cls.join(' ')}">${label}</div>`;
        title += r.seg === 0 ? ` · ${t.selected}` : r.bd ? ` · ${t.bd(r.bd)}` : '';
      }
      cell.innerHTML = html;
      cell.title = title;
      cell.setAttribute('aria-label', title);
      grid.appendChild(cell);
    }
    return grid;
  }

  function renderSummary(range) {
    const t = T();
    if (!range) {
      $summary.innerHTML = `<p class="empty-hint">${t.hint}</p>`;
      return;
    }
    const ms = range.milestones;
    const step = (color, n) =>
      `<li style="--c:var(${color})" data-goto="${keyOf(ms[n])}"><span class="k">${t.bd(n)}</span><span class="v">${fmt(ms[n])}</span></li>`;
    $summary.innerHTML = `
      <div class="sum-top">
        <div class="picked" data-goto="${selected}">${t.selected}<b>${fmt(fromKey(selected))}</b></div>
        <button class="btn quiet" id="clear">${t.clear}</button>
      </div>
      <ol class="steps">
        ${step('--c-g', 1)}${step('--c-g', 15)}
        ${step('--c-y', 16)}${step('--c-y', 30)}
        ${step('--c-o', 31)}${step('--c-o', 45)}
      </ol>`;
    document.getElementById('clear').onclick = () => select(null);
  }

  function renderHolidayList() {
    const t = T();
    const y = view.getFullYear();
    const rows = holidaysOfYear(y).map(h => {
      const moved = keyOf(h.d) !== keyOf(h.obs);
      const en = lang !== 'en' ? HOL_NAMES[h.id].en : '';
      const extra = [en, moved ? t.observedTo(fmt(h.obs)) : ''].filter(Boolean).join(' ');
      return { d: h.d, html: `<span class="d">${fmt(h.d)}</span><span><span class="n">${hname(h.id)}</span><span class="obs">${extra}</span></span>` };
    });
    for (const [id, dateOf] of Object.entries(OPTIONAL)) {
      const d = dateOf(y);
      rows.push({ d, opt: true, html: `<span class="d">${fmt(d)}</span><span><span class="n">${hname(id)}</span><span class="obs">${isOn(id) ? t.listOptOn : t.listOptOff}</span></span>` });
    }
    rows.sort((a, b) => a.d - b.d);
    document.getElementById('holist-ul').innerHTML = rows.map(r => `<li${r.opt ? ' class="opt"' : ''}>${r.html}</li>`).join('');
    document.querySelector('#holist summary').textContent = t.holList(y);
  }

  function select(k) {
    selected = (k && k !== selected) ? k : null;
    store.set('steamcal.selected', selected);
    render();
  }

  $months.addEventListener('click', e => {
    const cell = e.target.closest('button.cell');
    if (cell) select(cell.dataset.key);
  });
  const shift = n => { view = new Date(view.getFullYear(), view.getMonth() + n, 1); render(); };
  // 요약의 날짜를 누르면 그 달로 이동
  $summary.addEventListener('click', e => {
    const row = e.target.closest('[data-goto]');
    if (!row) return;
    const d = fromKey(row.dataset.goto);
    view = new Date(d.getFullYear(), d.getMonth(), 1);
    render();
  });
  // 휴대폰: 좌우로 밀어서 달 넘기기
  let touch = null;
  $months.addEventListener('touchstart', e => {
    const t0 = e.changedTouches[0];
    touch = { x: t0.clientX, y: t0.clientY };
  }, { passive: true });
  $months.addEventListener('touchend', e => {
    if (!touch) return;
    const t1 = e.changedTouches[0];
    const dx = t1.clientX - touch.x, dy = t1.clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shift(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.getElementById('prev').onclick = () => shift(-1);
  document.getElementById('next').onclick = () => shift(1);
  document.getElementById('today').onclick = () => { view = new Date(now.getFullYear(), now.getMonth(), 1); render(); };
  document.addEventListener('keydown', e => {
    if (e.target.closest('input, textarea, button')) return;
    if (e.key === 'ArrowLeft') shift(-1);
    if (e.key === 'ArrowRight') shift(1);
  });

  document.querySelectorAll('#lang button').forEach(b => {
    b.addEventListener('click', () => {
      lang = b.dataset.lang;
      store.set('steamcal.lang', lang);
      applyStatic();
      render();
    });
  });

  applyStatic();
  render();
})();
</script>
</body>
</html>
